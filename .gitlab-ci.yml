image: node:20

stages:
  - lint
  - test
  - build

.backend-rules: &backend-rules
  rules:
    - changes:
        - backend/**/*

.frontend-rules: &frontend-rules
  rules:
    - changes:
        - frontend/**/*

backend:lint:
  stage: lint
  <<: *backend-rules
  cache:
    key: backend-npm
    paths:
      - backend/.npm/
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm run lint

backend:test:
  stage: test
  <<: *backend-rules
  cache:
    key: backend-npm
    paths:
      - backend/.npm/
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm test

backend:build:
  stage: build
  <<: *backend-rules
  cache:
    key: backend-npm
    paths:
      - backend/.npm/
  script:
    - cd backend
    - npm ci --cache .npm --prefer-offline
    - npm run build

frontend:lint:
  stage: lint
  <<: *frontend-rules
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint

frontend:test:
  stage: test
  <<: *frontend-rules
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test

frontend:build:
  stage: build
  <<: *frontend-rules
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
